name: Supabase keep-alive

# Supabase free tier pauzuje projekt po 7 dniach bez API requests.
# Ten cron pinguje go codziennie aby zapobiec auto-pauzie.
# Koszt: ~10 s/dzień × 30 ≈ 5 min/mc (z 2000 min/mc free tier).
#
# UWAGA: GitHub wyłącza crony po 60 dniach bez aktywności w repo
# (stan `disabled_inactivity`) — tak umarł ten keepalive 12.08.2026,
# przez co Supabase spauzował projekt i apka przestała się ładować.
# Dlatego pierwszy krok każdego runa woła API "enable workflow" dla
# wszystkich cronów — to resetuje ich 60-dniowe liczniki bez commitów.

on:
  schedule:
    - cron: '0 6 * * *'  # codziennie 06:00 UTC (08:00 PL latem)
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      # Reset liczników PRZED pingiem — gdy Supabase leży (5xx), ping
      # failuje i kroki po nim by się nie wykonały, a crony muszą żyć
      # także podczas awarii backendu.
      - name: Odśwież 60-dniowe liczniki cronów (anty disabled_inactivity)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in keepalive.yml portfolio-snapshot.yml backup.yml; do
            gh api --method PUT \
              "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "odświeżono: $wf"
          done

      - name: Curl REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Próba SELECT na tabelę publicznie odczytywaną (np. categories systemowych).
          # Jeśli tabela jest pod RLS bez polityki dla anon — curl wraca 200 z [].
          # Liczy się sam request, nie zawartość.
          status=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1")
          echo "HTTP $status"
          [[ "$status" -ge 200 && "$status" -lt 500 ]] || exit 1
